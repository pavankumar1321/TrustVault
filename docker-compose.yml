version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trustvault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: trustvaultpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trustvault:trustvaultpass@db:5432/trustvault
      SECRET_KEY: change-this-to-a-random-32-byte-secret-in-production
      STORAGE_DIR: /app/storage/documents
      MAX_FILE_SIZE_MB: "50"
      ALLOWED_EXTENSIONS: "pdf,docx,doc,xlsx,xls,pptx,txt,png,jpg,jpeg"
      SESSION_EXPIRE_HOURS: "24"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - storage_data:/app/storage/documents
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python -m alembic upgrade head &&
        python app/db/bootstrap.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # ─── React Frontend (production build via nginx) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustvault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
  storage_data:
